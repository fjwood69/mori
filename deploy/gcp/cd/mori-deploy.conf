# /etc/ssh/sshd_config.d/mori-deploy.conf — root:root 0644 (v2.3.17, ruling G3/G6).
# The CD deploy user can run the forced command and nothing else. The key lives in a root-owned
# static file the Google guest agent never writes, and the forced command is here, never an
# authorized_keys option the guest agent could drop.
Match User mori-deploy
    AuthorizedKeysFile /etc/ssh/authorized_keys.d/mori-deploy
    AuthenticationMethods publickey
    PasswordAuthentication no
    PermitTTY no
    PermitUserRC no
    AllowTcpForwarding no
    AllowAgentForwarding no
    AllowStreamLocalForwarding no
    PermitTunnel no
    X11Forwarding no
    ForceCommand /usr/local/sbin/mori-cd-deploy
