name: "CLA Assistant"

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        # contributor-assistant/github-action v2.6.1 — pinned to a full commit SHA because the
        # upstream repo was ARCHIVED 2026-03-23 (unmaintained); a SHA pin stops it floating.
        # Self-contained: runs entirely in Actions, no external service. GITHUB_TOKEN is enough
        # because signatures live in THIS repo (a PAT is only needed for a remote signature repo).
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Signatures persist here, on the dedicated `cla-signatures` branch (NOT main — keeps
          # signature commits from triggering ci.yml / cd.yml). The file is auto-created.
          path-to-signatures: 'signatures/version1/cla.json'
          branch: 'cla-signatures'
          # The agreement contributors are signing.
          path-to-document: 'https://github.com/fjwood69/mori/blob/main/.github/CLA.md'
          # Owners + bots don't sign the project's own CLA.
          allowlist: 'dependabot[bot],github-actions[bot],renovate[bot]'
          custom-allsigned-prcomment: 'All contributors have signed the CLA. ✍️ Thank you — merging is unblocked.'
