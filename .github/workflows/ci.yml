name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 removed — all actions in CI now target
# Node 24 natively (checkout@v5, setup-python@v6, setup-buildx-action@v4,
# build-push-action@v7).

jobs:
  lint:
    name: Lint & format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install ruff
          pip install -r requirements.txt

      - name: Ruff lint
        run: ruff check mori_advisor/

      - name: Ruff format check
        run: ruff format --check mori_advisor/

  plugin-validate:
    name: Plugin manifest validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      # Structural validation — the official `claude plugin validate` checker.
      - name: Validate plugin manifest
        run: claude plugin validate plugins/mori

      # Marketplace manifest lives at ./.claude-plugin/marketplace.json, so the
      # validator takes the repo root (the dir whose .claude-plugin/ holds it).
      - name: Validate marketplace manifest
        run: claude plugin validate .

      # Config-regression guard: the Claude Code MCP config must be parameterised
      # by ENV VARS (${MORI_SERVER_URL} / ${MORI_API_KEY}), not `userConfig` and not
      # a hardcoded localhost. `userConfig` was abandoned because its install prompt
      # never fires on `claude plugin install` (the CLI path most users take), so
      # self-hosted users silently hit the default and got ConnectionRefused. The
      # env-var pattern is what claude-mem and the official GitHub/Greptile plugins
      # ship and what works on CLI install. This guard pins that decision.
      - name: Guard — .mcp.json uses MORI_* env vars (no userConfig, no localhost)
        run: |
          python3 - <<'PY'
          import json, sys
          errs = []
          mcp = json.load(open("plugins/mori/.mcp.json"))
          srv = mcp.get("mcpServers", {}).get("mori", {})
          blob = json.dumps(srv)
          if "${MORI_SERVER_URL}" not in srv.get("url", ""):
              errs.append(".mcp.json `mori.url` must use ${MORI_SERVER_URL}.")
          if "${MORI_API_KEY}" not in json.dumps(srv.get("headers", {})):
              errs.append(".mcp.json `mori.headers` must use ${MORI_API_KEY}.")
          if "user_config" in blob:
              errs.append(".mcp.json still references ${user_config.*} — userConfig was abandoned for env vars.")
          if "localhost" in blob or "127.0.0.1" in blob:
              errs.append(".mcp.json hardcodes localhost/127.0.0.1 — must be ${MORI_SERVER_URL}.")
          if "userConfig" in json.load(open("plugins/mori/.claude-plugin/plugin.json")):
              errs.append("plugin.json still declares `userConfig` — config is via MORI_* env vars now.")
          for e in errs:
              print(f"::error::{e}")
          sys.exit(1 if errs else 0)
          print("OK: .mcp.json is env-var parameterised; no userConfig, no localhost.")
          PY

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install pytest pytest-asyncio
          pip install -r requirements.txt

      - name: Run pytest
        run: pytest -q -W error::RuntimeWarning

  test-postgres:
    name: Unit tests (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mori
          POSTGRES_PASSWORD: testpw
          POSTGRES_DB: mori
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mori"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install pytest pytest-asyncio
          pip install -r requirements.txt

      # Exercises the migration runner + (Stage C) FTS + REST API surface against a
      # real Postgres — the SQLite `test` job above covers the default backend.
      # MORI_TEST_DATABASE_URL un-skips the Postgres-gated tests.
      # test_rest_api.py is included to catch regressions like issue #12
      # (PostgresStore.parse_tags was async def, causing 'coroutine' not iterable).
      - name: Run dual-backend tests against Postgres
        env:
          MORI_TEST_DATABASE_URL: postgresql://mori:testpw@localhost:5432/mori
        run: pytest -q -W error::RuntimeWarning tests/test_migrations.py tests/test_search.py tests/test_rest_api.py tests/test_mcp_tools.py

  docker:
    name: Docker build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: ghcr.io/fjwood69/mori:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
