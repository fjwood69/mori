name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 removed — all actions in CI now target
# Node 24 natively (checkout@v5, setup-python@v6, setup-buildx-action@v4,
# build-push-action@v7).

jobs:
  hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # ⚠ THE ENFORCEMENT ASSERTS ON WHAT IS TRACKED, NEVER ON .gitignore. A gitignore rule is a
      # guard against ACCIDENT: it does nothing about a file that is already in the index, and
      # `git add -f` ignores it entirely. Checking the guard instead of the property is a control
      # that certifies its own precondition.
      - name: No generated or local-only artefact is TRACKED
        run: |
          set -uo pipefail
          # ⚠ `git ls-files` LISTS FILES, so a directory pattern must match a PATH COMPONENT and
          # never the end of the string: `.gitnexus/` appears as `.gitnexus/meta.json`. An
          # end-anchored directory pattern matches nothing and the gate passes vacuously.
          bad=$(git ls-files | grep -E \
            '(^|/)(\.gitnexus|__pycache__|\.venv|venv|node_modules|\.mypy_cache|\.ruff_cache|\.pytest_cache)/|(^|/)(\.env|\.secrets|\.DS_Store)$|\.py[cod]$' || true)
          if [ -n "$bad" ]; then
            echo "::error::these are tracked and must never be committed:"
            echo "$bad"
            exit 1
          fi
          echo "OK — no generated or local-only artefact is tracked"
      # The GUARD, checked separately and for a different reason: these rules lived only in
      # .git/info/exclude, which is LOCAL AND NEVER COMMITTED, so every fresh clone was unprotected.
      - name: .gitignore covers the denylist (so a FRESH CLONE is protected)
        run: |
          set -uo pipefail
          missing=""
          for p in ".gitnexus/" "__pycache__/" ".venv/" "node_modules/" ".env" ".secrets"; do
            grep -qxF -- "$p" .gitignore || missing="$missing $p"
          done
          if [ -n "$missing" ]; then
            echo "::error::.gitignore is missing:$missing"
            echo "these must be in the COMMITTED .gitignore, not in .git/info/exclude"
            exit 1
          fi
          echo "OK — .gitignore covers the denylist"

  sterility:
    name: Content sterility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check for internal/homelab markers in tracked content
        run: python scripts/check-sterility.py

  lint:
    name: Lint & format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install ruff
          pip install -r requirements.txt

      - name: Ruff lint
        run: ruff check mori_advisor/

      - name: Ruff format check
        run: ruff format --check mori_advisor/

  plugin-validate:
    name: Plugin manifest validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      # Structural validation — the official `claude plugin validate` checker.
      - name: Validate plugin manifest
        run: claude plugin validate plugins/mori

      # Marketplace manifest lives at ./.claude-plugin/marketplace.json, so the
      # validator takes the repo root (the dir whose .claude-plugin/ holds it).
      - name: Validate marketplace manifest
        run: claude plugin validate .

      # Packaging guard: the plugin must NOT bundle an MCP server. A bundled
      # `.mcp.json` registers a second `mori` server that collides with the user's
      # own `claude mcp add mori` connection (both resolve to mcp__mori__* tools),
      # leaving both red. The connection belongs to `claude mcp add`; the plugin
      # ships skills + hooks only. This guard pins that decision.
      - name: Guard — plugin ships no bundled MCP (skills + hooks only)
        run: |
          python3 - <<'PY'
          import json, os, sys
          errs = []
          if os.path.exists("plugins/mori/.mcp.json"):
              errs.append("plugins/mori/.mcp.json exists — the plugin must not bundle an MCP server (it collides with the user's `claude mcp add mori`).")
          if "userConfig" in json.load(open("plugins/mori/.claude-plugin/plugin.json")):
              errs.append("plugin.json declares `userConfig` — the plugin no longer takes connection config; the MCP server is added via `claude mcp add`.")
          for e in errs:
              print(f"::error::{e}")
          sys.exit(1 if errs else 0)
          print("OK: plugin is skills + hooks only; no bundled MCP, no userConfig.")
          PY

      # Mirror guard: plugins/mori/skills/ is a MANUAL copy of skills/ (see
      # scripts/sync-plugin-skills.sh). Fails CI if the two drift, so a canonical-only
      # skill edit can't ship a stale plugin mirror — the exact gap that let the v2.2.21
      # PostCompact→SessionStart line stay stale in the plugin copy (fixed in PR #49).
      - name: Guard — plugin skills mirror in sync with skills/
        run: bash scripts/sync-plugin-skills.sh --check

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install pytest pytest-asyncio
          pip install -r requirements.txt

      - name: Run pytest
        run: pytest -q -W error::RuntimeWarning

  test-postgres:
    name: Unit tests (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mori
          POSTGRES_PASSWORD: testpw
          POSTGRES_DB: mori
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mori"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install pytest pytest-asyncio
          pip install -r requirements.txt

      # Exercises the migration runner + (Stage C) FTS + REST API surface against a
      # real Postgres — the SQLite `test` job above covers the default backend.
      # MORI_TEST_DATABASE_URL un-skips the Postgres-gated tests.
      # test_rest_api.py is included to catch regressions like issue #12
      # (PostgresStore.parse_tags was async def, causing 'coroutine' not iterable).
      - name: Run dual-backend tests against Postgres
        env:
          MORI_TEST_DATABASE_URL: postgresql://mori:testpw@localhost:5432/mori
        run: pytest -q -W error::RuntimeWarning tests/test_migrations.py tests/test_search.py tests/test_rest_api.py tests/test_mcp_tools.py

  docker:
    name: Docker build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: ghcr.io/fjwood69/mori:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
