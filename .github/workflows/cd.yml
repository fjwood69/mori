name: CD

on:
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Pre-tag UAT gate (manual, run on NUC before pushing the tag):
#   bash ~/dotfiles/mori-uat/start-uat.sh
#   # Required: db_read ok, dream_watermark ok, auth ok on both port 8970 (SQLite) and 8972 (Postgres)
#   # Extended: curl -X POST http://localhost:8972/api/dream/run — no coroutine errors
#   bash ~/dotfiles/mori-uat/stop-uat.sh
# See ~/dotfiles/mori-uat/README.md for full checklist.

jobs:
  build-and-push:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/fjwood69/mori
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to GCE
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TS_AUTH_KEY }}

      - name: Wait for Tailscale route
        run: |
          for i in $(seq 1 10); do
            nc -z -w 3 ${{ secrets.GCE_HOST }} 22 && echo "SSH port reachable" && exit 0
            echo "Attempt $i: waiting..."
            sleep 3
          done
          echo "SSH port not reachable after 30s" && exit 1

      - name: Deploy to GCE via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.GCE_HOST }}
          username: ${{ secrets.GCE_USER }}
          key: ${{ secrets.GCE_SSH_KEY }}
          envs: GITHUB_REF_NAME
          script: |
            VERSION="${GITHUB_REF_NAME#v}"
            IMAGE="ghcr.io/fjwood69/mori:${VERSION}"
            sudo podman pull "$IMAGE"

            # Stop any process holding port 8968 or 8969 that isn't tracked by
            # rootful podman (e.g. startup-script rootless containers from a VM reboot)
            for PORT in 8968 8969; do
              PID=$(ss -tlnp 2>/dev/null | awk -v p=":${PORT} " '$0 ~ p {match($0, /pid=([0-9]+)/, a); if (a[1]) print a[1]}')
              if [ -n "$PID" ]; then
                CNAME=$(sudo podman ps --format "{{.Names}}" --filter "pid=${PID}" 2>/dev/null | head -1)
                [ -z "$CNAME" ] && sudo kill "$PID" 2>/dev/null && sleep 2 || true
              fi
            done

            # advisor blue/green
            sudo podman stop mori-advisor-new 2>/dev/null || true
            sudo podman rm mori-advisor-new 2>/dev/null || true
            sudo podman run -d \
              --name mori-advisor-new \
              --network=host \
              --restart=unless-stopped \
              -v /data/mori-advisor:/data/mori-advisor:Z \
              --env-file /data/mori-advisor/.env \
              "$IMAGE"

            # ingestion blue/green
            sudo podman stop mori-ingestion-new 2>/dev/null || true
            sudo podman rm mori-ingestion-new 2>/dev/null || true
            sudo podman run -d \
              --name mori-ingestion-new \
              --network=host \
              --restart=unless-stopped \
              -v /data/mori-advisor:/data/mori-advisor:Z \
              --env-file /data/mori-advisor/.env \
              "$IMAGE" python -m mori_advisor.ingestion_server

            # wait for both to be healthy
            for i in 1 2 3 4 5; do
              sleep $((i * 2))
              curl -sf http://localhost:8968/health && curl -sf http://localhost:8969/health && break
              [ $i -eq 5 ] && { sudo podman rm -f mori-advisor-new mori-ingestion-new; exit 1; }
            done

            # swap advisor
            sudo podman stop mori-advisor 2>/dev/null || true
            sudo podman rm mori-advisor 2>/dev/null || true
            sudo podman rename mori-advisor-new mori-advisor

            # swap ingestion
            sudo podman stop mori-ingestion 2>/dev/null || true
            sudo podman rm mori-ingestion 2>/dev/null || true
            sudo podman rename mori-ingestion-new mori-ingestion

  create-release:
    name: Create GitHub Release
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          VERSION="${{ github.ref_name }}"
          python3 - <<'EOF'
          import re, sys
          tag = "${{ github.ref_name }}"
          content = open("CHANGELOG.md").read()
          pattern = rf"(## {re.escape(tag)}.*?)(?=\n## v|\Z)"
          match = re.search(pattern, content, re.DOTALL)
          notes = match.group(1).strip() if match else f"Release {tag}"
          with open("release_notes.md", "w") as f:
              f.write(notes)
          EOF

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" &>/dev/null; then
            gh release edit "${{ github.ref_name }}" \
              --repo "${{ github.repository }}" \
              --title "${{ github.ref_name }}" \
              --notes-file release_notes.md
          else
            gh release create "${{ github.ref_name }}" \
              --repo "${{ github.repository }}" \
              --title "${{ github.ref_name }}" \
              --notes-file release_notes.md
          fi
