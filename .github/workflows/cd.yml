name: CD

on:
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/fjwood69/mori
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to GCE
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TS_AUTH_KEY }}

      - name: Wait for Tailscale route
        run: |
          for i in $(seq 1 10); do
            nc -z -w 3 ${{ secrets.GCE_HOST }} 22 && echo "SSH port reachable" && exit 0
            echo "Attempt $i: waiting..."
            sleep 3
          done
          echo "SSH port not reachable after 30s" && exit 1

      - name: Deploy to GCE via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.GCE_HOST }}
          username: ${{ secrets.GCE_USER }}
          key: ${{ secrets.GCE_SSH_KEY }}
          envs: GITHUB_REF_NAME
          script: |
            VERSION="${GITHUB_REF_NAME#v}"
            IMAGE="ghcr.io/fjwood69/mori:${VERSION}"
            sudo podman pull "$IMAGE"
            sudo podman stop mori-advisor-new 2>/dev/null || true
            sudo podman rm mori-advisor-new 2>/dev/null || true
            sudo podman run -d \
              --name mori-advisor-new \
              --network=host \
              --restart=unless-stopped \
              -v /data/mori-advisor:/data/mori-advisor:Z \
              --env-file /data/mori-advisor/.env \
              "$IMAGE"
            for i in 1 2 3 4 5; do
              sleep $((i * 2))
              curl -sf http://localhost:8968/health && break
              [ $i -eq 5 ] && { sudo podman rm -f mori-advisor-new; exit 1; }
            done
            sudo podman stop mori-advisor 2>/dev/null || true
            sudo podman rm mori-advisor 2>/dev/null || true
            sudo podman rename mori-advisor-new mori-advisor
