name: CD

on:
  push:
    tags:
      - "v*"

env:
  # docker/login-action is still on Node 20 (no v4 with Node-24 support yet).
  # Keep the force flag until login-action ships a Node-24 native version.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# #73: one deploy at a time, queued, never cancelled (a deploy cancelled halfway through retagging is worse than a
# queued one). GitHub keeps one running and one pending run per group: a THIRD tag pushed while one is pending
# replaces the pending one, so never tag while a deploy is pending (docs/RELEASING.md).
concurrency:
  group: cd-production
  cancel-in-progress: false

# Pre-tag UAT gate (manual on deploy host before pushing the tag):
#   Run your local mori UAT start script, verify db_read / dream_watermark / auth
#   on ports 8970 (SQLite) and 8972 (Postgres), then stop UAT.
#   Extended: curl -X POST http://localhost:8972/api/dream/run — no coroutine errors

jobs:
  # #73: CD deploys only a tag whose own commit passed CI. Every other job needs this one. It validates the tag
  # name first (strict vX.Y.Z), then: annotated tag -> this exact commit, on main, version == pyproject, and the
  # newest ci.yml run on this commit (push to main or workflow_dispatch) succeeded with ci-ok and every job green.
  # No environment here: production secrets never reach a job before the tag is validated. No override exists;
  # the emergency path is the manual one in docs/RELEASING.md.
  gate:
    name: CI gate (this commit passed CI)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.gate.outputs.sha }}
      ci_run_id: ${{ steps.gate.outputs.ci_run_id }}
      ci_run_url: ${{ steps.gate.outputs.ci_run_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Gate
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: python3 scripts/cd_gate.py check --repo "$REPO" --tag "$TAG" --sha "$SHA"

  build-and-push:
    name: Build & push Docker image
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # #73: build exactly the commit the gate approved, never whatever the tag points at by now.
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.gate.outputs.sha }}

      # Gate: the release docs must reflect this version before anything builds.
      # Prevents CHANGELOG/ROADMAP silently lapsing behind releases.
      - name: Release docs gate
        env:
          TAG: ${{ github.ref_name }}
        run: python3 scripts/check-release-docs.py "$TAG"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/fjwood69/mori
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to GCE
    needs: [gate, build-and-push]
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTH_KEY }}

      - name: Wait for Tailscale route
        env:
          GCE_HOST: ${{ secrets.GCE_HOST }}
        run: |
          for i in $(seq 1 10); do
            nc -z -w 3 "$GCE_HOST" 22 && echo "SSH port reachable" && exit 0
            echo "Attempt $i: waiting..."
            sleep 3
          done
          echo "SSH port not reachable after 30s" && exit 1

      - name: Deploy to GCE via SSH
        env:
          GCE_SSH_KEY: ${{ secrets.GCE_SSH_KEY }}
          GCE_USER: ${{ secrets.GCE_USER }}
          GCE_HOST: ${{ secrets.GCE_HOST }}
          # #73: the production host's public key ("ssh-ed25519 AAAA..."), provisioned from a key verified out of
          # band. Host-key checking is ON: a changed host key fails the deploy instead of being trusted blindly.
          GCE_HOST_KEY: ${{ secrets.GCE_HOST_KEY }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # #73: the tag name reaches the remote shell below, so it is validated again here (the gate already did)
          # and only the validated version, which can contain nothing but digits and dots, crosses as data.
          [[ "$REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "bad tag name"; exit 1; }
          VERSION="${REF_NAME#v}"
          if [ -z "$GCE_HOST_KEY" ]; then echo "FATAL: GCE_HOST_KEY secret missing — refusing to deploy without host-key checking"; exit 1; fi

          KEYFILE=$(mktemp)
          KNOWN=$(mktemp)
          chmod 600 "$KEYFILE"
          printf '%s\n' "$GCE_SSH_KEY" > "$KEYFILE"
          printf '%s %s\n' "$GCE_HOST" "$GCE_HOST_KEY" > "$KNOWN"
          trap "rm -f '$KEYFILE' '$KNOWN'" EXIT

          ssh -i "$KEYFILE" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$KNOWN" \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            "${GCE_USER}@${GCE_HOST}" \
            "MORI_VERSION='${VERSION}' bash -s" << 'REMOTESCRIPT'
          set -e
          VERSION="${MORI_VERSION}"
          IMAGE_VERSION="ghcr.io/fjwood69/mori:${VERSION}"
          IMAGE_LATEST="ghcr.io/fjwood69/mori:latest"
          IMAGE_ROLLBACK="ghcr.io/fjwood69/mori:previous-rollback"
          ENVFILE="/data/mori-advisor/.env"
          MORI_UID=$(id -u mori)
          RT="XDG_RUNTIME_DIR=/run/user/${MORI_UID} DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/${MORI_UID}/bus"
          # All three mori app containers share the :latest image and are managed
          # as rootless Quadlet units — restart them together so none drifts onto
          # stale code (the drift class this migration exists to kill).
          UNITS="mori-advisor mori-ingestion mori-msg"

          # Containers are managed by rootless systemd **Quadlet** units owned by
          # the mori user (installed by the GCE startup script to
          # ~mori/.config/containers/systemd/; source of truth: deploy/gcp/quadlet/).
          # CD only refreshes the image and restarts the units — the run-spec lives
          # in the units, not here, so the startup/CD definitions can no longer drift.
          # The CD user reaches the mori user systemd/podman via `sudo su - mori`.
          # All runtime config (incl. secrets) lives in $ENVFILE — CD never sees it.

          if [ ! -f "$ENVFILE" ]; then
            echo "FATAL: $ENVFILE missing — startup script must write it first"; exit 1
          fi

          # Rollback tag: pin the currently-running :latest before we move it, so a
          # bad deploy reverts with
          #   podman tag …:previous-rollback …:latest && systemctl --user restart $UNITS
          sudo su - mori -c "$RT podman image exists '$IMAGE_LATEST'" \
            && sudo su - mori -c "$RT podman tag '$IMAGE_LATEST' '$IMAGE_ROLLBACK'" || true

          # Pull the new build and move :latest onto it. The Quadlet units reference
          # :latest and do NOT re-pull on restart, so retagging locally is what makes
          # the restart pick up exactly this build (deterministic — not registry latest).
          sudo su - mori -c "$RT podman pull '$IMAGE_VERSION'"
          sudo su - mori -c "$RT podman tag '$IMAGE_VERSION' '$IMAGE_LATEST'"

          # Restart the units — Quadlet recreates each container from the refreshed
          # :latest. Atomic stop-old/start-new per unit (no port clash under --network=host).
          sudo su - mori -c "$RT systemctl --user restart $UNITS"

          # Health gate
          for i in 1 2 3 4 5; do
            sleep $((i * 2))
            curl -sf http://localhost:8968/health && curl -sf http://localhost:8969/health && break
            [ $i -eq 5 ] && { echo "health check failed"; exit 1; }
          done

          # Deployment contract gate — the SAME scripts/verify-deployment.py that
          # UAT runs, executed INSIDE the freshly-deployed container against its own
          # endpoint. Asserts the full route surface (not just /health). A deploy
          # that serves /health but 404s on feature routes fails here instead of
          # reporting a false green. Uses the first configured API key from the
          # env-file (mode 600, so read via sudo).
          VERIFY_KEY=$(sudo grep -m1 '^MORI_API_KEYS=' "$ENVFILE" | cut -d= -f2- | cut -d, -f1 | cut -d: -f2)
          if [ -z "$VERIFY_KEY" ]; then echo "FATAL: no MORI_API_KEYS in $ENVFILE — refusing to ship auth-off"; exit 1; fi
          echo "Running deployment contract against live container..."
          sudo su - mori -c "$RT podman exec mori-advisor python /app/scripts/verify-deployment.py http://localhost:8968 '$VERIFY_KEY'" || {
            echo "DEPLOYMENT CONTRACT FAILED — the deployed container is not serving the expected route surface"
            exit 1
          }
          echo "Deploy OK: $IMAGE_VERSION (rootless, --env-file, contract verified)"
          REMOTESCRIPT

  create-release:
    name: Create GitHub Release
    needs: [gate, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.gate.outputs.sha }}

      # #73: the tag must still point at the commit the gate approved and that was deployed.
      - name: Tag unmoved since the gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ needs.gate.outputs.sha }}
        run: python3 scripts/cd_gate.py verify-tag --repo "$REPO" --tag "$TAG" --sha "$SHA"

      - name: Extract release notes from CHANGELOG
        id: notes
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ needs.gate.outputs.sha }}
          CI_RUN_ID: ${{ needs.gate.outputs.ci_run_id }}
          CI_RUN_URL: ${{ needs.gate.outputs.ci_run_url }}
        run: |
          python3 - <<'EOF'
          import os, re
          tag = os.environ["TAG"]
          content = open("CHANGELOG.md").read()
          pattern = rf"(## {re.escape(tag)}.*?)(?=\n## v|\Z)"
          match = re.search(pattern, content, re.DOTALL)
          notes = match.group(1).strip() if match else f"Release {tag}"
          notes += (
              f"\n\n---\nDeployed by CD after the #73 gate: commit {os.environ['SHA']} passed CI in run "
              f"{os.environ['CI_RUN_ID']} ({os.environ['CI_RUN_URL']})."
          )
          with open("release_notes.md", "w") as f:
              f.write(notes)
          EOF

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$REPO" &>/dev/null; then
            gh release edit "$TAG" --repo "$REPO" --title "$TAG" --notes-file release_notes.md
          else
            gh release create "$TAG" --repo "$REPO" --title "$TAG" --notes-file release_notes.md --verify-tag
          fi
