name: CD

on:
  push:
    tags:
      - "v*"

env:
  # docker/login-action is still on Node 20 (no v4 with Node-24 support yet).
  # Keep the force flag until login-action ships a Node-24 native version.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# #73: one deploy at a time, queued, never cancelled (a deploy cancelled halfway through retagging is worse than a
# queued one). GitHub keeps one running and one pending run per group: a THIRD tag pushed while one is pending
# replaces the pending one, so never tag while a deploy is pending (docs/RELEASING.md).
concurrency:
  group: cd-production
  cancel-in-progress: false

# Pre-tag UAT gate (manual on deploy host before pushing the tag):
#   Run your local mori UAT start script, verify db_read / dream_watermark / auth
#   on ports 8970 (SQLite) and 8972 (Postgres), then stop UAT.
#   Extended: curl -X POST http://localhost:8972/api/dream/run — no coroutine errors

jobs:
  # #73: CD deploys only a tag whose own commit passed CI. Every other job needs this one. It validates the tag
  # name first (strict vX.Y.Z), then: annotated tag -> this exact commit, on main, version == pyproject, and the
  # newest ci.yml run on this commit (push to main or workflow_dispatch) succeeded with ci-ok and every job green.
  # No environment here, so the environment's secrets (the Tailscale key) never reach a job before the tag is
  # validated. The deploy SSH key is still a REPOSITORY secret that any branch's workflow can read; only the host
  # being reachable solely over the tailnet keeps that from mattering (moving it is the next item). No override exists;
  # the emergency path is the manual one in docs/RELEASING.md.
  gate:
    name: CI gate (this commit passed CI)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.gate.outputs.sha }}
      ci_run_id: ${{ steps.gate.outputs.ci_run_id }}
      ci_run_url: ${{ steps.gate.outputs.ci_run_url }}
      is_highest: ${{ steps.gate.outputs.is_highest }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Gate
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: python3 scripts/cd_gate.py check --repo "$REPO" --tag "$TAG" --sha "$SHA"

  build-and-push:
    name: Build & push Docker image
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      # #73: the deploy pulls THIS build by digest, never by a registry tag that could be moved in between.
      digest: ${{ steps.build.outputs.digest }}

    steps:
      # #73: build exactly the commit the gate approved, never whatever the tag points at by now.
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false

      # Gate: the release docs must reflect this version before anything builds.
      # Prevents CHANGELOG/ROADMAP silently lapsing behind releases.
      - name: Release docs gate
        env:
          TAG: ${{ github.ref_name }}
        run: python3 scripts/check-release-docs.py "$TAG"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/fjwood69/mori
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ needs.gate.outputs.is_highest == 'true' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to GCE
    needs: [gate, build-and-push]
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    permissions: {}

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTH_KEY }}

      - name: Wait for Tailscale route
        env:
          GCE_HOST: ${{ secrets.GCE_HOST }}
        run: |
          for i in $(seq 1 10); do
            nc -z -w 3 "$GCE_HOST" 22 && echo "SSH port reachable" && exit 0
            echo "Attempt $i: waiting..."
            sleep 3
          done
          echo "SSH port not reachable after 30s" && exit 1

      - name: Deploy to GCE via SSH
        env:
          GCE_SSH_KEY: ${{ secrets.GCE_SSH_KEY }}
          GCE_USER: ${{ secrets.GCE_USER }}
          GCE_HOST: ${{ secrets.GCE_HOST }}
          # #73: the production host's public key ("ssh-ed25519 AAAA..."), provisioned from a key verified out of
          # band. Host-key checking is ON: a changed host key fails the deploy instead of being trusted blindly.
          GCE_HOST_KEY: ${{ secrets.GCE_HOST_KEY }}
          REF_NAME: ${{ github.ref_name }}
          DIGEST: ${{ needs.build-and-push.outputs.digest }}
        run: |
          set -euo pipefail
          # #73: the tag name reaches the remote shell below, so it is validated again here (the gate already did)
          # and only the validated version, which can contain nothing but digits and dots, crosses as data.
          [[ "$REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "bad tag name"; exit 1; }
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "FATAL: no image digest from the build"; exit 1; }
          # The secret is "<type> <base64>" (the known_hosts entry without the host). Checked before anything runs
          # on the host, so a malformed secret fails here, not halfway through a deploy.
          GCE_HOST_KEY="$(printf '%s' "$GCE_HOST_KEY" | tr -d '\r' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
          [[ "$GCE_HOST_KEY" =~ ^(ssh-ed25519|ecdsa-sha2-nistp(256|384|521)|ssh-rsa)\ [A-Za-z0-9+/]+={0,3}$ ]] \
            || { echo "FATAL: GCE_HOST_KEY missing or not '<type> <base64>' — refusing to deploy without host-key checking"; exit 1; }

          KEYFILE=$(mktemp)
          KNOWN=$(mktemp)
          chmod 600 "$KEYFILE"
          printf '%s\n' "$GCE_SSH_KEY" > "$KEYFILE"
          printf '%s %s\n' "$GCE_HOST" "$GCE_HOST_KEY" > "$KNOWN"
          trap "rm -f '$KEYFILE' '$KNOWN'" EXIT
          ssh-keygen -F "$GCE_HOST" -f "$KNOWN" >/dev/null || { echo "FATAL: known_hosts entry for the host is unusable"; exit 1; }

          # v2.3.17 (ruling G3/G6): the deploy user can run ONE forced command, which accepts only
          # "deploy <tag> <digest>" (deploy/gcp/cd/mori-cd-deploy). No shell, no here-document,
          # no env file read: the key table never leaves the host. The forced command converts the
          # key table to hashes (v2.3.17+), restarts the units, gates on health and runs the
          # store check (deploy/gcp/cd/mori-cd-deploy-as-mori, scripts/verify-store.py).
          ssh -i "$KEYFILE" -T \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$KNOWN" \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            "${GCE_USER}@${GCE_HOST}" \
            "deploy ${REF_NAME} ${DIGEST}"

      - name: Deployment contract (from the runner, CD's own write key)
        env:
          GCE_HOST: ${{ secrets.GCE_HOST }}
          # v2.3.17 (ruling H1): CD's own key, role `write` and nothing more. The plain secret exists
          # only here (environment `production`); the host holds its hash. The contract proves the
          # lock on every deploy with the two canaries (scripts/verify-deployment.py).
          MORI_CD_KEY: ${{ secrets.MORI_CD_KEY }}
          MORI_CD_KEY_NAME: ${{ vars.MORI_CD_KEY_NAME }}
          # The contract script is the GATED commit's, fetched from the public repository: no checkout,
          # so the job keeps `permissions: {}`.
          GATED_SHA: ${{ needs.gate.outputs.sha }}
        run: |
          set -euo pipefail
          [[ -n "$MORI_CD_KEY" && -n "$MORI_CD_KEY_NAME" ]] || { echo "FATAL: MORI_CD_KEY / MORI_CD_KEY_NAME not set"; exit 1; }
          [[ "$GATED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "FATAL: no gated commit"; exit 1; }
          CONTRACT="$RUNNER_TEMP/verify-deployment.py"
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GATED_SHA}/scripts/verify-deployment.py" -o "$CONTRACT"
          python3 "$CONTRACT" "http://${GCE_HOST}:8968" "$MORI_CD_KEY" "$MORI_CD_KEY_NAME" || {
            echo "DEPLOYMENT CONTRACT FAILED — the route surface or the canon lock is not as required"
            exit 1
          }

  create-release:
    name: Create GitHub Release
    needs: [gate, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false

      - name: Extract release notes from CHANGELOG
        id: notes
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ needs.gate.outputs.sha }}
          CI_RUN_ID: ${{ needs.gate.outputs.ci_run_id }}
          CI_RUN_URL: ${{ needs.gate.outputs.ci_run_url }}
        run: |
          python3 - <<'EOF'
          import os, re
          tag = os.environ["TAG"]
          content = open("CHANGELOG.md").read()
          pattern = rf"(## {re.escape(tag)}.*?)(?=\n## v|\Z)"
          match = re.search(pattern, content, re.DOTALL)
          notes = match.group(1).strip() if match else f"Release {tag}"
          notes += (
              f"\n\n---\nDeployed by CD after the #73 gate: commit {os.environ['SHA']} passed CI in run "
              f"{os.environ['CI_RUN_ID']} ({os.environ['CI_RUN_URL']})."
          )
          with open("release_notes.md", "w") as f:
              f.write(notes)
          EOF

      # #73: the tag must still point at the commit the gate approved and that was deployed: checked
      # immediately before the release is created, and again after (the tag ruleset forbids moving it).
      - name: Tag unmoved since the gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ needs.gate.outputs.sha }}
        run: python3 scripts/cd_gate.py verify-tag --repo "$REPO" --tag "$TAG" --sha "$SHA"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$REPO" &>/dev/null; then
            gh release edit "$TAG" --repo "$REPO" --title "$TAG" --notes-file release_notes.md
          else
            gh release create "$TAG" --repo "$REPO" --title "$TAG" --notes-file release_notes.md --verify-tag
          fi

      - name: Tag still unmoved after the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ needs.gate.outputs.sha }}
        run: python3 scripts/cd_gate.py verify-tag --repo "$REPO" --tag "$TAG" --sha "$SHA"
